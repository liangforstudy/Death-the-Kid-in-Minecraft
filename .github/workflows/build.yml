name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip the build until the Forge MDK (gradlew) has been committed,
      # so the workflow stays green on an empty repo.
      - name: Check for Gradle project
        id: check
        run: |
          if [ -f gradlew ]; then
            echo "gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No gradlew found yet - skipping build until the Forge MDK is committed."
          fi

      # Forge 1.20.1 (47.x) targets Java 17.
      - name: Set up JDK 17
        if: steps.check.outputs.gradle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.check.outputs.gradle == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        if: steps.check.outputs.gradle == 'true'
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        if: steps.check.outputs.gradle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: death-the-kid
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
